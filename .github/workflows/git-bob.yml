name: git-bob

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: git-bob-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  respond:
    # Only trusted repository participants can start the bot.
    if: >-
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issues' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
         contains(github.event.issue.body, 'git-bob')) ||
        (github.event_name == 'issue_comment' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
         contains(github.event.comment.body, 'git-bob'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          # Start from the trusted default branch, not the pull request's checkout.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check model configuration
        env:
          GIT_BOB_LLM_NAME: ${{ secrets.GIT_BOB_LLM_NAME }}
        run: |
          if [ -z "$GIT_BOB_LLM_NAME" ]; then
            echo "::error::Set the GIT_BOB_LLM_NAME repository secret and the matching provider API key. See docs/git-bob.md."
            exit 1
          fi

      - name: Install git-bob
        run: python -m pip install git-bob==0.28.0

      - name: Run git-bob
        env:
          GIT_BOB_AGENT_NAME: git-bob
          GIT_BOB_LLM_NAME: ${{ secrets.GIT_BOB_LLM_NAME }}
          GITHUB_API_KEY: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GH_MODELS_API_KEY: ${{ secrets.GH_MODELS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SYSTEM_MESSAGE: |
            You are git-bob, a skilled HTML, CSS, JavaScript, TypeScript,
            React, Vite and PostgreSQL developer.
            This repository contains the Dutch static GitHub Pages PWA
            Het Verzegelde Dossier and the escape-the-city subapp.
            Follow AGENTS.md and the guidelines in the affected directory.
            Keep changes focused on the requested task and preserve Dutch UI copy.
            Keep database authorization and score calculations in server-side RPCs.
            Never expose service-role keys, passwords, JWT secrets or player data.
            Never edit applied SQL migrations; add a new numbered migration.
            Follow the documented cache and version rules for application changes.
            Review generated changes and never claim to have run tests you did not run.
        run: git-bob github-action "$REPOSITORY" "$ISSUE_NUMBER"
