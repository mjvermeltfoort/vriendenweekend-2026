name: Issue Command Bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    name: Run Issue Bot
    runs-on: ubuntu-latest
    if: >
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (startsWith(github.event.comment.body, '/think') ||
       startsWith(github.event.comment.body, '/solve') ||
       startsWith(github.event.comment.body, '/review'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: escape-the-city/package-lock.json

      - name: React to issue command
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node .github/scripts/issue-bot.cjs --react-only

      - name: Run issue bot (review and prepare solve)
        id: solve
        if: "!startsWith(github.event.comment.body, '/think')"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          node .github/scripts/issue-bot.cjs

      - name: Investigate issue (/think)
        id: think
        if: startsWith(github.event.comment.body, '/think')
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/master/install.sh | sh
          command -v rtk
          rtk --version
          CAVEMAN_INSTALL_DIR="${RUNNER_TEMP}/caveman-skill"
          mkdir -p "$CAVEMAN_INSTALL_DIR"
          (
            cd "$CAVEMAN_INSTALL_DIR"
            npx -y skills add JuliusBrussee/caveman --skill caveman --copy -y > "${RUNNER_TEMP}/caveman-install.log" 2>&1 ||
              { tail -n 60 "${RUNNER_TEMP}/caveman-install.log"; exit 1; }
          )
          CAVEMAN_SKILL="$CAVEMAN_INSTALL_DIR/.agents/skills/caveman/SKILL.md"
          test -s "$CAVEMAN_SKILL"
          npm i -g @continuedev/cli@latest
          python3 - <<'PY'
          import os
          from pathlib import Path
          mode = "deep" if os.environ.get("COMMENT_BODY", "").lower().startswith("/think deep") else ("quick" if os.environ.get("COMMENT_BODY", "").lower().startswith("/think quick") else "standard")
          prompt = ("Investigation mode: " + mode + "\nInvestigate issue #" + os.environ["ISSUE_NUMBER"] + ": " + os.environ["ISSUE_TITLE"]
                    + "\n" + os.environ.get("ISSUE_BODY", "")
                    + "\nUser instructions: " + os.environ.get("COMMENT_BODY", "")
                    + "\nFollow .continue/rules/think.md and the Caveman skill. Research in depth, reply concisely in Dutch with evidence. Do not edit files.")
          Path("/tmp/think-prompt.txt").write_text(prompt)
          PY
          touch "${RUNNER_TEMP}/issue-bot-usage-start"
          set +e
          env -u GITHUB_TOKEN -u GH_TOKEN cn --config .continue/config.yaml --rule .continue/rules/rtk.md --rule .continue/rules/think.md --rule "$CAVEMAN_SKILL" --allow Bash -p "$(cat /tmp/think-prompt.txt)" > /tmp/think-output.txt 2>&1
          status=$?
          set -e
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          {
            echo "### RTK — /think"
            echo "Versie: $(rtk --version)"
            rtk gain || echo "RTK-besparing niet beschikbaar"
            echo "Caveman-regel: $CAVEMAN_SKILL"
          } >> "$GITHUB_STEP_SUMMARY"
          BOT_STATUS="$status" python3 - <<'PY'
          import json, os
          from pathlib import Path
          full_output = Path("/tmp/think-output.txt").read_text(errors="replace")
          report = full_output.strip()
          if len(report) > 2600:
              report = "Uitvoer ingekort; volledige log staat bij GitHub Actions.\n\n" + report[-2400:]
          header = "### /think — repository investigation" if os.environ["BOT_STATUS"] == "0" else "### /think failed (see Actions logs)"
          Path("/tmp/think-comment.json").write_text(json.dumps({"body": header + "\n\n" + report}))
          PY
          echo "Research output bytes: $(wc -c < /tmp/think-output.txt)" >> "$GITHUB_STEP_SUMMARY"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data-binary @/tmp/think-comment.json "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/comments"
          test "$status" -eq 0

      - name: Install Continue CLI (solve)
        if: startsWith(github.event.comment.body, '/solve')
        run: |
          set -euo pipefail
          if [ ! -f .continue/config.yaml ]; then
            echo ".continue/config.yaml not found in repo. Please add it." >&2
            exit 1
          fi

          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/master/install.sh | sh
          command -v rtk
          rtk --version
          rtk gain

          CAVEMAN_INSTALL_DIR="${RUNNER_TEMP}/caveman-skill"
          mkdir -p "$CAVEMAN_INSTALL_DIR"
          (
            cd "$CAVEMAN_INSTALL_DIR"
            npx -y skills add JuliusBrussee/caveman --skill caveman --copy -y
          )
          CAVEMAN_SKILL="$CAVEMAN_INSTALL_DIR/.agents/skills/caveman/SKILL.md"
          if [ ! -f "$CAVEMAN_SKILL" ]; then
            echo "Caveman skill not found at $CAVEMAN_SKILL" >&2
            exit 1
          fi

          npm i -g @continuedev/cli@latest
          cn --version
          echo "RTK: $(rtk --version)"
          echo "Caveman: $CAVEMAN_SKILL"
          echo "RTK en Caveman worden via --rule aan Continue meegegeven."

      - name: Install Escape the City dependencies for Continue
        if: startsWith(github.event.comment.body, '/solve')
        working-directory: escape-the-city
        run: |
          set -euo pipefail
          npm ci
          echo "Vitest beschikbaar voor Continue: $(npm exec -- vitest --version)"
          echo "Dependencies installed; Continue can now run lint, tests and build." >> "$GITHUB_STEP_SUMMARY"

      - name: Run Continue CLI to solve and modify code
        id: cont
        if: startsWith(github.event.comment.body, '/solve')
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/issue-bot"
          BOT_TMP="${RUNNER_TEMP}/issue-bot"
          BASE_SHA="$(git rev-parse HEAD)"
          PROMPT="$(printf "%s" "${COMMENT_BODY}" | sed -E 's#^/solve[[:space:]]*:?[[:space:]]*##')"

          COMMENTS_URL="https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100"
          # Supply only latest successful investigation, not entire conversation history.
          curl --fail-with-body -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "${COMMENTS_URL}" |
            jq -r --argjson excludeId "${COMMENT_ID}" '
              [.[] | select(.id != $excludeId and (.body | startswith("### /think — repository investigation")))]
              | sort_by(.created_at) | last | .body // "(no prior /think report)"
            ' | head -c 12000 > "${BOT_TMP}/comments.txt"

          {
            echo "Repository wants a fix PR for Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
            echo
            echo "Issue body:"
            printf "%s\n" "${ISSUE_BODY}"
            echo
            echo "User prompt:"
            printf "%s\n" "${PROMPT}"
            echo
            echo "Latest /think analysis (may be stale; verify against current code):"
            if [ -s "${BOT_TMP}/comments.txt" ]; then cat "${BOT_TMP}/comments.txt"; else echo "(none)"; fi
            echo
            echo "Instructions:"
            echo "- Make minimal, correct code changes directly in the working tree."
            echo "- Include tests or config updates if needed."
            echo "- Do not create or switch branches, commit, push, or open PRs; only change working-tree files. GitHub Actions handles branch, commit, and PR."
            echo "- NEVER modify files under .github/workflows/ (including when requested in an issue)."
            echo "- RTK and Caveman are loaded as CLI rules. Use rtk for supported terminal commands; preserve raw diagnostics if RTK truncates important errors."
            echo "- Dependencies are already installed in escape-the-city. Vitest is available."
            echo "- MUST run: npm --prefix escape-the-city run lint, npm --prefix escape-the-city test, and npm --prefix escape-the-city run build after code changes. Fix any failures before finishing."
            echo "- Start with targeted file searches, read only necessary lines, and test changed areas first."
            echo "- Stop investigating once root cause and fix are evidenced; avoid repeating searches."
          } > "${BOT_TMP}/prompt.txt"

          echo "Running Continue CLI in headless mode"
          CAVEMAN_SKILL="${RUNNER_TEMP}/caveman-skill/.agents/skills/caveman/SKILL.md"
          test -s "$CAVEMAN_SKILL"
          command -v rtk
          echo "Continue skills: rtk=$(rtk --version), caveman=$CAVEMAN_SKILL" >> "$GITHUB_STEP_SUMMARY"
          touch "${RUNNER_TEMP}/issue-bot-usage-start"
          env -u GITHUB_TOKEN -u GH_TOKEN cn             --config .continue/config.yaml             --rule .continue/rules/rtk.md             --rule "$CAVEMAN_SKILL"             --auto             --allow Write             --allow Edit             --allow Bash             -p "$(cat "${BOT_TMP}/prompt.txt")"             2>&1 | tee "${BOT_TMP}/continue.log"

          # Check both uncommitted changes and commits created by the agent.
          if ! git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            echo "::error::Continue changed to a branch that does not descend from the checked-out commit." >&2
            exit 1
          fi
          CHANGED_PATHS="$({ git diff --name-only "$BASE_SHA" HEAD; git diff --name-only; git diff --cached --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          if printf '%s\n' "$CHANGED_PATHS" | grep -q '^\.github/workflows/'; then
            echo "::error::Issue-bot is not permitted to modify GitHub Actions workflow files." >&2
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            if [ -n "$(git status --porcelain)" ]; then
              echo "::error::Continue left both committed and uncommitted changes; manual inspection is needed." >&2
              exit 1
            fi
            # Never push Continue's HEAD directly: it may contain earlier workflow
            # commits in its ancestry, which GITHUB_TOKEN is not allowed to publish.
            # Preserve the agent's file changes, but let create-pull-request make
            # a fresh commit containing only the validated diff.
            echo "Converting Continue commits to working-tree changes for PR creation."
            git reset --mixed "$BASE_SHA"
          fi

          if [ -n "$CHANGED_PATHS" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "pr_title=fix: Resolve #${ISSUE_NUMBER} - ${ISSUE_TITLE} (bot via Continue)" >> "$GITHUB_OUTPUT"
            {
              echo "This PR was generated by a Continue-based CI run using repo .continue/config.yaml."
              echo
              echo "- Issue: #${ISSUE_NUMBER}"
              echo "- Command: /solve"
              echo
              echo "Execution log (truncated):"
              echo '```'
              tail -n 100 "${BOT_TMP}/continue.log" || true
              echo '```'
            } > "${BOT_TMP}/pr-body.md"
            echo "pr_body_file=${BOT_TMP}/pr-body.md" >> "$GITHUB_OUTPUT"
          else
            echo "No changes produced by Continue runner."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### RTK-rapportage"
            rtk gain || echo "RTK-besparing niet beschikbaar"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Escape the City before PR
        id: verify_city
        if: steps.cont.outputs.has_changes == 'true'
        working-directory: escape-the-city
        env:
          VITE_SUPABASE_URL: https://smoke-test.supabase.co
          VITE_SUPABASE_ANON_KEY: smoke-test-public-key
        run: |
          set -euo pipefail
          echo "Installing dependencies from lockfile"
          npm ci
          # Run every check even if a previous one fails, so the agent gets
          # complete actionable diagnostics instead of only the first failure.
          set +e
          npm run lint
          lint_status=$?
          npm test
          test_status=$?
          npm run build
          build_status=$?
          set -e
          {
            echo "### Escape the City verification"
            echo "npm ci: geslaagd"
            echo "Lint (exit): $lint_status"
            echo "Vitest (exit): $test_status"
            echo "Build (exit): $build_status"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$lint_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            echo "::error::Escape the City checks failed (lint=$lint_status, tests=$test_status, build=$build_status). PR blocked."
            exit 1
          fi

      - name: Create PR from Continue changes
        id: cpr_continue
        if: steps.cont.outputs.has_changes == 'true' && steps.verify_city.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: issue-bot/issue-${{ github.event.issue.number }}-continue
          commit-message: ${{ steps.solve.outputs.pr_title }}
          title: ${{ steps.solve.outputs.pr_title }}
          body-path: ${{ steps.cont.outputs.pr_body_file }}
          labels: bot, automated, issue-bot, continue

      - name: Comment usage and estimated cost on issue
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          THINK_OUTCOME: ${{ steps.think.outcome }}
          REVIEW_OUTCOME: ${{ steps.solve.outcome }}
          SOLVE_OUTCOME: ${{ steps.cont.outcome }}
          PR_OUTCOME: ${{ steps.cpr_continue.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_city.outcome }}
        run: node .github/scripts/issue-bot-cost-report.cjs
