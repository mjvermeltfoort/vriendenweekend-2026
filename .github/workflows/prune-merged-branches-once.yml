          171 feature/verkadefabriek-vloertegels-raadsel 554719953303a4fc2afdf9a0a05429724ef03f79
          186 fix/active-challenge-button-mobile-layout 316c907b169c359bed3a249b66cde788e31bf45e
          162 fix/bosch-remove-extra-controls-161 036d84b829bf56f022155f0feb29c7f2a9609260
          158 fix/bosch-story-audio-157 a946d3717642e85ad4402e7fd8907709df70ff1a
