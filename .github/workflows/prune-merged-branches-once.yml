name: One-time merged branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-merged-branches-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'mjvermeltfoort/vriendenweekend-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove only SHA-verified branches from merged PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deleted=0
          skipped=0
          while read -r pr branch expected_sha; do
            [[ -z "$pr" ]] && continue
            pr_json="$(gh api "repos/${GH_REPO}/pulls/${pr}")"
            pr_merged="$(jq -r '.merged_at // empty' <<<"$pr_json")"
            pr_branch="$(jq -r '.head.ref' <<<"$pr_json")"
            pr_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            pr_base="$(jq -r '.base.ref' <<<"$pr_json")"
            if [[ -z "$pr_merged" || "$pr_branch" != "$branch" || "$pr_sha" != "$expected_sha" || "$pr_base" != "main" ]]; then
              echo "SKIP $branch: PR #$pr cannot be verified as merged at expected head"
              skipped=$((skipped+1))
              continue
            fi
            ref_json="$(gh api "repos/${GH_REPO}/git/ref/heads/${branch}")"
            current_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            if [[ "$current_sha" != "$expected_sha" ]]; then
              echo "SKIP $branch: branch moved since verification"
              skipped=$((skipped+1))
              continue
            fi
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
            echo "DELETED $branch (PR #$pr)"
            deleted=$((deleted+1))
          done <<'VERIFIED_MERGED_BRANCHES'
          150 chatgpt/bosch-monster-minigame-20261012 3987c85266889c7cd80744896afb824c66c592e6
          152 chatgpt/fix-bosch-monster-text-contrast-20261012 5faa6eabb6f961ee8afca61c60e4c3806c8f8edd
          166 chatgpt/mobile-challenge-layout-20261013 f754cf81c52a538e264656bc6af6718a8dfb8838
          164 chatgpt/zwanenbroedershuis-gevelwachters-20261013 7aff652dc05f975f4ac84f8b79806de4c8b05e2d
          193 ci/checks-pr-only 5431bb25808d7fe3c8e1e4e801738c861bd1067c
          192 cleanup/remove-issue-bot 82f0d145285d98ee6184626082147e8e3432e533
          182 feat/henk-schub-reminders 5911728a38076912afae2f0257d06eee37e131d6
          174 feat/hint-henk-spoken-hints 902cf90437aaa4843296dd156569c052cb546c54
